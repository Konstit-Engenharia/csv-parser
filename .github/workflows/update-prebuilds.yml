name: Update prebuilds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            library: libcsv_native.so
          - target: darwin-arm64
            os: macos-latest
            library: libcsv_native.dylib
          - target: darwin-x64
            os: macos-15-intel
            library: libcsv_native.dylib
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install native toolchain
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y clang cmake git ninja-build
          else
            brew install cmake ninja
          fi

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: prebuild-${{ matrix.target }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'toolchains/*.cmake') }}
          restore-keys: |
            prebuild-${{ matrix.target }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native target
        env:
          PRESET: ${{ matrix.target }}-release
        run: |
          cmake --preset "$PRESET"
          cmake --build --preset "$PRESET"

      - name: Stage native target
        run: bun scripts/stage-native.ts "${{ matrix.target }}"

      - name: Test staged native target
        env:
          CSV_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/prebuilds/${{ matrix.target }}/${{ matrix.library }}
        run: bun test test/native-parser-core.test.ts

      - name: Record native build environment
        run: bun scripts/native-build-predicate.ts "${{ matrix.target }}" native-build-predicate.json

      - name: Attest native target
        id: attest
        uses: actions/attest@v4
        with:
          predicate-path: native-build-predicate.json
          predicate-type: https://konstit.com/attestations/native-build/v1
          subject-path: prebuilds/${{ matrix.target }}/${{ matrix.library }}

      - name: Stage native attestation
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p prebuilds/provenance
          cp "$ATTESTATION_BUNDLE" "prebuilds/provenance/${{ matrix.target }}.json"

      - name: Archive native target
        run: |
          tar -czf "candidate-${{ matrix.target }}.tgz" \
            "prebuilds/${{ matrix.target }}" \
            "prebuilds/provenance/${{ matrix.target }}.json"

      - name: Upload native target
        uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: candidate-${{ matrix.target }}.tgz
          if-no-files-found: error

  assemble:
    name: Assemble tracked prebuild update
    needs: build
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download native targets
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: candidates
          merge-multiple: true

      - name: Replace tracked native targets
        run: |
          for archive in candidates/*.tgz; do
            tar -xzf "$archive"
          done

      - name: Update and verify manifest
        env:
          CSV_NATIVE_SOURCE_COMMIT: ${{ github.sha }}
        run: bun scripts/verify-native-package.ts --update-manifest

      - name: Archive tracked prebuilds
        run: tar -czf "tracked-prebuilds-${GITHUB_SHA}.tgz" prebuilds

      - name: Attest tracked prebuild archive
        uses: actions/attest@v4
        with:
          subject-path: tracked-prebuilds-${{ github.sha }}.tgz

      - name: Upload tracked prebuild update
        uses: actions/upload-artifact@v4
        with:
          name: tracked-prebuilds-${{ github.sha }}
          path: tracked-prebuilds-${{ github.sha }}.tgz
          if-no-files-found: error
