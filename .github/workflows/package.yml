name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish as an immutable release; leave empty for a package test only
        required: false
        type: string

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - id: release
        name: Validate release target
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          package_version="$(bun -e 'process.stdout.write((await Bun.file("package.json").json()).version)')"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "release tag $RELEASE_TAG must equal package version tag v$package_version" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "release tag $RELEASE_TAG does not identify the checked-out commit" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed prebuilds
        run: bun run verify:native-package

      - name: Verify native build attestations
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/verify-native-package.ts --verify-attestations

      - name: Build distribution files
        run: bun run build:dist

      - name: Pack verified artifact once
        run: |
          mkdir -p artifacts
          bun pm pack --filename artifacts/package.tgz --ignore-scripts

      - id: checksum
        name: Record artifact checksum
        run: echo "sha256=$(shasum -a 256 artifacts/package.tgz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest package artifact
        uses: actions/attest@v4
        with:
          subject-path: artifacts/package.tgz

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: konstit-csv-package
          path: artifacts/package.tgz
          if-no-files-found: error

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.assemble.outputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: konstit-csv-package
          path: artifacts

      - name: Verify artifact checksum
        run: echo "${{ needs.assemble.outputs.sha256 }}  artifacts/package.tgz" | shasum -a 256 --check

      - name: Smoke-test installed package
        run: bun scripts/test-package.ts artifacts/package.tgz

  publish:
    name: Publish package
    if: inputs.release_tag != ''
    needs:
      - assemble
      - smoke
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.assemble.outputs.release_tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download tested package artifact
        uses: actions/download-artifact@v4
        with:
          name: konstit-csv-package
          path: artifacts

      - name: Verify artifact checksum
        run: echo "${{ needs.assemble.outputs.sha256 }}  artifacts/package.tgz" | shasum -a 256 --check

      - name: Prepare draft release with tested package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.assemble.outputs.release_tag }}
        run: |
          asset_path="artifacts/konstit-csv-${RELEASE_TAG}.tgz"
          cp artifacts/package.tgz "$asset_path"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" "$asset_path" --draft --generate-notes --title "$RELEASE_TAG" --verify-tag
            exit 0
          fi

          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [ "$is_draft" = "true" ]; then
            gh release upload "$RELEASE_TAG" "$asset_path" --clobber
            exit 0
          fi

          existing_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --pattern "konstit-csv-${RELEASE_TAG}.tgz" --dir "$existing_dir"
          expected="$(shasum -a 256 "$asset_path" | awk '{print $1}')"
          actual="$(shasum -a 256 "$existing_dir/konstit-csv-${RELEASE_TAG}.tgz" | awk '{print $1}')"
          if [ "$actual" != "$expected" ]; then
            echo "published release asset does not match the tested package" >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.assemble.outputs.release_tag }}
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)"
          if [ "$is_draft" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

      - name: Publish tested package artifact
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish artifacts/package.tgz --registry https://registry.npmjs.org/
