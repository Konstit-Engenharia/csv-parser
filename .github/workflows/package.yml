name: Package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to repair and publish; leave empty for a package test only
        required: false
        type: string
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  assemble:
    name: Assemble package
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - id: release
        name: Validate release target
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="$EVENT_RELEASE_TAG"
          if [ -z "$release_tag" ]; then
            release_tag="$MANUAL_RELEASE_TAG"
          fi
          package_version="$(bun -e 'process.stdout.write((await Bun.file("package.json").json()).version)')"
          if [ "$release_tag" != "v$package_version" ]; then
            echo "release tag $release_tag must equal package version tag v$package_version" >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$release_tag")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "release tag $release_tag does not identify the checked-out commit" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            is_draft="$(gh release view "$release_tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != "false" ]; then
              echo "release $release_tag must already be published" >&2
              exit 1
            fi
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify committed prebuilds
        run: bun run verify:native-package

      - name: Verify native build attestations
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/verify-native-package.ts --verify-attestations

      - name: Build distribution files
        run: bun run build:dist

      - name: Pack verified artifact once
        run: |
          mkdir -p artifacts
          bun pm pack --filename artifacts/package.tgz --ignore-scripts

      - id: checksum
        name: Record artifact checksum
        run: echo "sha256=$(shasum -a 256 artifacts/package.tgz | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Attest package artifact
        uses: actions/attest@v4
        with:
          subject-path: artifacts/package.tgz

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: konstit-csv-package
          path: artifacts/package.tgz
          if-no-files-found: error

  smoke:
    name: Smoke ${{ matrix.target }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: darwin-arm64
            os: macos-latest
          - target: darwin-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: konstit-csv-package
          path: artifacts

      - name: Verify artifact checksum
        run: echo "${{ needs.assemble.outputs.sha256 }}  artifacts/package.tgz" | shasum -a 256 --check

      - name: Smoke-test installed package
        run: bun scripts/test-package.ts artifacts/package.tgz

  publish:
    name: Publish package
    if: >-
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - assemble
      - smoke
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
    steps:
      - name: Checkout release
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.assemble.outputs.release_tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Download tested package artifact
        uses: actions/download-artifact@v4
        with:
          name: konstit-csv-package
          path: artifacts

      - name: Verify artifact checksum
        run: echo "${{ needs.assemble.outputs.sha256 }}  artifacts/package.tgz" | shasum -a 256 --check

      - name: Attach tested package to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.assemble.outputs.release_tag }}
        run: |
          asset_path="artifacts/konstit-csv-${RELEASE_TAG}.tgz"
          cp artifacts/package.tgz "$asset_path"
          gh release upload "$RELEASE_TAG" "$asset_path" --clobber

      - name: Publish tested package artifact
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun publish artifacts/package.tgz --registry https://registry.npmjs.org/
