name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Bun checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Check for duplicate dependencies
        run: bun dedupe --check

      - name: Verify tracked native package
        run: bun run verify:native-package

      - name: Smoke tracked Linux prebuild
        run: bun test test/native-parser-core.test.ts

      - name: Check format
        run: bunx dprint check

      - name: Lint
        run: bun run lint

      - name: Test Bun API
        run: bun run test

      - name: Benchmark regression smoke
        run: bun bench/regression-smoke.ts

      - name: csv-parser comparison guard
        run: bun bench/csv-parser/regression-guard.ts
