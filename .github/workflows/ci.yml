name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Bun native checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y clang cmake git ninja-build

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: fetchcontent-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'toolchains/*.cmake') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Check for duplicate dependencies
        run: bun dedupe --check

      - name: Verify tracked native package
        run: bun run verify:native-package

      - name: Smoke tracked Linux prebuild
        run: bun test test/native-parser-core.test.ts

      - name: Check format
        run: bunx dprint check

      - name: Lint
        run: bun run lint

      - name: Build native parser
        run: bun run build:native

      - name: Test Bun API
        env:
          CSV_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/build/linux-x64/libcsv_native.so
        run: bun run test

      - name: Test native C++
        run: bun scripts/test-native.ts

      - name: Native sanitizer fuzz
        run: bun run test:native:sanitize

      - name: Benchmark regression smoke
        env:
          CSV_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/build/linux-x64/libcsv_native.so
        run: bun bench/regression-smoke.ts

      - name: csv-parser comparison guard
        env:
          CSV_NATIVE_LIBRARY_PATH: ${{ github.workspace }}/build/linux-x64/libcsv_native.so
        run: bun bench/csv-parser/regression-guard.ts
