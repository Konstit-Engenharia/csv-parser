name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Bun native checks
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install native toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build pkg-config

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            .cache/vcpkg
            .cache/vcpkg-binary
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        run: |
          if [ ! -d "$VCPKG_ROOT/.git" ]; then
            rm -rf "$VCPKG_ROOT"
            git clone --depth 1 https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          fi
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check format
        run: bunx --bun dprint check

      - name: Lint
        run: bun run lint

      - name: Build native parser
        run: bun run build:native

      - name: Test Bun API
        run: bun test

      - name: Test native C++
        run: bun scripts/test-native.ts

      - name: Benchmark regression smoke
        run: bun bench/regression-smoke.ts
